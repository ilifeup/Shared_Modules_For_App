name: S1 Shared Core Checks
on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/s1-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/s1-core.yml'
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP lint and smoke tests
        run: |
          set -euo pipefail
          for f in packages/laravel/shared_core/src/*.php packages/laravel/shared_core/tests/*.php; do php -l "$f"; done
          php packages/laravel/shared_core/tests/smoke.php
          php packages/laravel/shared_core/tests/notice_read_smoke.php
          php packages/laravel/shared_core/tests/token_policy_smoke.php
          php packages/laravel/shared_core/tests/isolation_contract_smoke.php
          php packages/laravel/shared_core/tests/auth_settings_sms_smoke.php
      - name: Composer package validation
        working-directory: packages/laravel/shared_core
        run: composer validate --strict
  dart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Dart format (prints the diff on failure)
        working-directory: packages/flutter/shared_core
        shell: bash
        run: |
          dart format lib test
          git diff -- . > "$RUNNER_TEMP/format.diff"
          if [ -s "$RUNNER_TEMP/format.diff" ]; then
            bash ../../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/format.diff" "dart format diff" 4000 30 tail
            exit 1
          fi
      - name: Dart analyze and smoke
        working-directory: packages/flutter/shared_core
        shell: bash
        run: |
          set -o pipefail
          dart pub get
          dart analyze
          dart run test/smoke.dart
          dart run test/contracts_smoke.dart
          dart run test/member_api_smoke.dart
          dart run test/session_api_smoke.dart
          dart run test/login_identifier_smoke.dart
          dart run test/registration_api_smoke.dart
          dart run test/password_reset_api_smoke.dart
          dart run test/profile_membership_smoke.dart
          dart run test/notice_api_smoke.dart
          dart run test/notification_api_smoke.dart
          dart run test/event_api_smoke.dart
          dart run test/booking_api_smoke.dart
          dart run test/booking_group_api_smoke.dart
          dart run test/article_api_smoke.dart
          dart run test/s9_api_smoke.dart
