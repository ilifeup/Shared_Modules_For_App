openapi: 3.1.0
info:
  title: EachCore shared member API (per-App backend)
  version: 0.6.0
  description: |
    Contract of the API implemented by examples/poc_backend (S1–S6) and integrated by each App
    (tiandi-app first). Every App runs its own backend, database and tokens; nothing here is a
    shared production service and there is no SSO.

    Conventions
    - Prefix `/api/v1`. Success `{ "data": ..., "meta"?: ... }`.
    - Errors `{ "error": { "code", "message", "fields"?, "request_id" } }`; every response carries `X-Request-Id`.
    - Authentication: Sanctum personal access token, `Authorization: Bearer <token>`.
    - `x-verification: required` marks endpoints behind `member.verified`: when the current
      verification policy is not satisfied they answer 403 `VERIFICATION_REQUIRED` with
      `fields.verification = ["email"|"phone"]`.
    - `x-dart` names the shared Dart client method / DTO (packages/flutter/shared_core).
    - Request endpoints for codes and reset links answer identically whether or not the account exists:
      same status, error code and Retry-After for registered, verified and unknown numbers; a provider
      failure on a public send answers 200; public verify / reset endpoints answer OTP_INVALID for
      wrong, expired and locked codes (OTP_EXPIRED / OTP_LOCKED only on the authenticated phone change).

    Verified against the routes by `.github/scripts/check_openapi_routes.py` in CI.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: password
  - name: profile
  - name: membership
  - name: notices
  - name: notifications
  - name: calendar
  - name: bookings
security:
  - bearer: []
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      security: []
      responses:
        '200':
          description: API and database reachable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok] }
                      database: { type: string, enum: [ok] }
                      server_time: { type: string, format: date-time }
        '503': { $ref: '#/components/responses/Error' }

  /auth/policy:
    get:
      tags: [auth]
      operationId: authPolicy
      security: []
      x-dart: RegistrationApi.policy -> AuthPolicy
      responses:
        '200':
          description: Current member verification policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [verification_policy, required_fields]
                    properties:
                      verification_policy: { $ref: '#/components/schemas/VerificationPolicy' }
                      required_fields:
                        type: array
                        items: { type: string, enum: [name, email, phone, password] }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      x-dart: RegistrationApi.register -> RegistrationResult
      x-rate-limit: 10/min per IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                phone: { type: string, description: 'Taiwan mobile, e.g. 0912345678', maxLength: 30 }
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Account created; email verification always sent, phone code only under phone_required
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/Member' }
                      verification:
                        type: object
                        properties:
                          email: { type: [string, 'null'], examples: [sent] }
                          phone: { type: [string, 'null'], description: 'sent | send_failed:<CODE> | null' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      x-dart: SessionApi.login -> String (token)
      x-rate-limit: 10/min per IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email or Taiwan mobile number }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Token issued (also for unverified members; see data.user.verification)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [token, token_type, user]
                    properties:
                      token: { type: string }
                      token_type: { type: string, enum: [Bearer] }
                      user: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-dart: SessionApi.logout
      description: Revokes only the token used for this request.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { logged_out: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/email/resend:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      security: []
      x-dart: RegistrationApi.resendEmailVerification
      x-rate-limit: 3/min per IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/phone/send-otp:
    post:
      tags: [auth]
      operationId: sendPhoneOtp
      security: []
      x-dart: RegistrationApi.sendPhoneOtp
      x-rate-limit: 5/min per IP; resend cooldown and hourly limits per number and globally
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }


  /auth/phone/verify:
    post:
      tags: [auth]
      operationId: verifyPhone
      security: []
      x-dart: RegistrationApi.verifyPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { verified: { type: boolean } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/forgot:
    post:
      tags: [password]
      operationId: forgotPassword
      security: []
      x-dart: PasswordResetApi.requestEmailLink
      x-rate-limit: 3/min per IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/reset:
    post:
      tags: [password]
      operationId: resetPasswordWithEmailToken
      security: []
      x-dart: PasswordResetApi.resetWithEmailToken
      description: Token from the reset email (60 minutes, single use). Revokes every token of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Reset' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/phone/send-otp:
    post:
      tags: [password]
      operationId: sendPasswordResetCode
      security: []
      x-dart: PasswordResetApi.requestPhoneCode
      x-rate-limit: 5/min per IP; shares the SMS cooldown and hourly limits
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }


  /auth/password/phone/reset:
    post:
      tags: [password]
      operationId: resetPasswordWithPhoneCode
      security: []
      x-dart: PasswordResetApi.resetWithPhoneCode
      description: Needs a password-reset code (registration or phone-change codes are rejected). Revokes every token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, password, password_confirmation]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Reset' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      tags: [profile]
      operationId: me
      x-dart: MemberApi.myProfile -> MemberProfile
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/profile:
    get:
      tags: [profile]
      operationId: myProfile
      x-dart: MemberApi.myProfile -> MemberProfile
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [profile]
      operationId: updateProfile
      x-verification: required
      x-dart: ProfileApi.update / MemberApi.updateDisplayName -> MemberProfile
      description: Only name and display_name; other fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                display_name: { type: string, maxLength: 80 }
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/email:
    post:
      tags: [profile]
      operationId: changeEmail
      x-dart: ProfileApi.changeEmail -> MemberProfile
      description: Adds or changes the email (current password required); saved as unverified and a link is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/phone/send-otp:
    post:
      tags: [profile]
      operationId: sendPhoneChangeCode
      x-dart: ProfileApi.sendPhoneChangeCode
      description: Sends a phone-change code to the NEW number (current password required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Error' }

  /me/phone/verify:
    post:
      tags: [profile]
      operationId: confirmPhoneChange
      x-dart: ProfileApi.confirmPhoneChange -> MemberProfile
      description: The number is saved (verified) only after this succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/avatar:
    get:
      tags: [profile]
      operationId: getAvatar
      x-verification: required
      x-dart: App AvatarRepository.fetch (binary; not in the JSON transport)
      responses:
        '200':
          description: The owner's avatar (512x512 JPEG)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [profile]
      operationId: uploadAvatar
      x-verification: required
      x-dart: App AvatarRepository.upload (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: 'JPEG, PNG or WebP, max 5 MB; re-encoded server side' }
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [profile]
      operationId: deleteAvatar
      x-verification: required
      x-dart: App AvatarRepository.delete
      responses:
        '200': { $ref: '#/components/responses/MemberResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }

  /me/membership:
    get:
      tags: [membership]
      operationId: myMembership
      x-verification: required
      x-dart: MembershipApi.mine -> Membership
      responses:
        '200':
          description: Current level; an expired period falls back to the default level
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [level]
                    properties:
                      level: { $ref: '#/components/schemas/MembershipLevel' }
                      starts_at: { type: [string, 'null'], format: date-time }
                      ends_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }

  /membership-levels:
    get:
      tags: [membership]
      operationId: membershipLevels
      security: []
      x-dart: MembershipApi.levels -> List<MembershipLevel>
      responses:
        '200':
          description: Levels and their benefits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MembershipLevel' } }

  /notices:
    get:
      tags: [notices]
      operationId: memberNotices
      x-verification: required
      x-dart: NoticeApi.memberNotices -> NoticePage (MemberApi.notices -> List<Notice>)
      description: Visible public and member notices; pinned first, then newest. 20 per page.
      parameters:
        - { name: category, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Notice page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notice' } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notices/{id}:
    get:
      tags: [notices]
      operationId: memberNotice
      x-verification: required
      x-dart: MemberApi.notice -> Notice
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/NoticeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notices/{id}/read:
    post:
      tags: [notices]
      operationId: markNoticeRead
      x-verification: required
      x-dart: NoticeApi.markRead
      description: Idempotent; repeated calls keep a single read record.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { id: { type: string }, is_read: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/notices:
    get:
      tags: [notices]
      operationId: publicNotices
      security: []
      x-dart: NoticeApi.publicNotices -> List<Notice>
      x-rate-limit: 60/min per IP
      parameters:
        - { name: category, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Public-audience notices (no is_read)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notice' } }
                  meta: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/notices/{id}:
    get:
      tags: [notices]
      operationId: publicNotice
      security: []
      x-dart: NoticeApi.publicNotice -> Notice
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/NoticeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notice-categories:
    get:
      tags: [notices]
      operationId: noticeCategories
      security: []
      x-dart: NoticeApi.categories -> List<NoticeCategory>
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }

  /me/notifications:
    get:
      tags: [notifications]
      operationId: myNotifications
      x-verification: required
      x-dart: NotificationApi.list -> NotificationPage
      description: The member's own in-app notifications, newest first, 20 per page.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MemberNotification' } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: myUnreadNotificationCount
      x-verification: required
      x-dart: NotificationApi.unreadCount -> int
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { unread_count: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }

  /me/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      x-verification: required
      x-dart: NotificationApi.markAllRead -> int (updated)
      description: Idempotent; a second call updates 0 rows.
      responses:
        '200':
          description: All marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
                      unread_count: { type: integer, enum: [0] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }

  /me/notifications/{id}:
    get:
      tags: [notifications]
      operationId: myNotification
      x-verification: required
      x-dart: NotificationApi.detail -> MemberNotification
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: One notification (another member's id is not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MemberNotification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      x-verification: required
      x-dart: NotificationApi.markRead -> MemberNotification
      description: Idempotent; the first read time is kept.
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MemberNotification' }
                  meta: { type: object, properties: { unread_count: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    get:
      tags: [calendar]
      operationId: memberEvents
      x-verification: required
      x-dart: EventApi.memberEvents -> EventRange
      description: |
        Published and cancelled events (public and member-only) overlapping [from, to).
        Drafts are never returned. At most 62 days per query and 200 events (meta.truncated).
      parameters:
        - { $ref: '#/components/parameters/RangeFrom' }
        - { $ref: '#/components/parameters/RangeTo' }
      responses:
        '200': { $ref: '#/components/responses/EventRange' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{id}:
    get:
      tags: [calendar]
      operationId: memberEvent
      x-verification: required
      x-dart: EventApi.memberEvent -> CalendarEvent
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/EventResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/events:
    get:
      tags: [calendar]
      operationId: publicEvents
      security: []
      x-dart: EventApi.publicEvents -> EventRange
      x-rate-limit: 60/min per IP
      description: Public-audience events only; same range rules as /events.
      parameters:
        - { $ref: '#/components/parameters/RangeFrom' }
        - { $ref: '#/components/parameters/RangeTo' }
      responses:
        '200': { $ref: '#/components/responses/EventRange' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/events/{id}:
    get:
      tags: [calendar]
      operationId: publicEvent
      security: []
      x-dart: EventApi.publicEvent -> CalendarEvent
      x-rate-limit: 60/min per IP
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/EventResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /events/{id}/booking:
    get:
      tags: [bookings]
      operationId: eventBookingInfo
      x-verification: required
      x-dart: BookingApi.info -> BookingInfo
      description: Capacity, booked count, remaining seats, whether booking is possible now and my active booking.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/BookingInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/bookings:
    post:
      tags: [bookings]
      operationId: bookEvent
      x-verification: required
      x-dart: BookingApi.book -> BookingInfo
      description: |
        Creates a confirmed booking. Capacity check and insert run in one transaction holding
        a row lock on the event, so the last seat cannot be taken twice.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { $ref: '#/components/responses/BookingInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BookingConflict' }

  /me/bookings:
    get:
      tags: [bookings]
      operationId: myBookings
      x-verification: required
      x-dart: BookingApi.mine -> List<Booking>
      description: Own bookings (confirmed and cancelled), newest first, 20 per page.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Booking page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Booking' }
                        - type: object
                          properties:
                            event:
                              type: object
                              properties:
                                id: { type: string }
                                title: { type: string }
                                starts_at: { type: string, format: date-time }
                                ends_at: { type: string, format: date-time }
                                status: { type: string, enum: [published, cancelled, draft] }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/bookings/{id}/cancel:
    post:
      tags: [bookings]
      operationId: cancelMyBooking
      x-verification: required
      x-dart: BookingApi.cancel -> BookingInfo
      description: Own bookings only (another member's id is not found). The record is kept as cancelled.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/BookingInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BookingConflict' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Sanctum personal access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RangeFrom:
      name: from
      in: query
      required: true
      description: ISO 8601 date-time with offset (e.g. 2026-11-01T00:00:00+08:00) or a date (00:00 UTC)
      schema: { type: string }
    RangeTo:
      name: to
      in: query
      required: true
      description: Exclusive end; later than from and at most 62 days after it
      schema: { type: string }
    Uuid:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    VerificationPolicy:
      type: string
      enum: [email_required, phone_required]
    Member:
      x-dart: MemberProfile
      type: object
      required: [id, display_name, email_verified, phone_verified, verification]
      properties:
        id: { type: string }
        name: { type: string, x-dart: MemberProfile.name }
        display_name: { type: string, x-dart: MemberProfile.displayName }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: E.164, x-dart: MemberProfile.phone }
        email_verified: { type: boolean, x-dart: MemberProfile.emailVerified }
        phone_verified: { type: boolean, x-dart: MemberProfile.phoneVerified }
        verification:
          type: object
          required: [policy, satisfied, missing]
          properties:
            policy: { $ref: '#/components/schemas/VerificationPolicy' }
            satisfied: { type: boolean, x-dart: MemberProfile.verificationSatisfied }
            missing: { type: [string, 'null'], enum: [email, phone, null], x-dart: MemberProfile.verificationMissing }
        has_avatar: { type: boolean, x-dart: MemberProfile.hasAvatar }
        profile:
          type: object
          properties:
            complete: { type: boolean, x-dart: MemberProfile.profileComplete }
            missing:
              type: array
              items: { type: string, enum: [name, email, phone] }
              x-dart: MemberProfile.missingFields
        created_at: { type: [string, 'null'], format: date-time }
    MembershipLevel:
      x-dart: MembershipLevel
      type: object
      required: [code, name, is_default]
      properties:
        code: { type: string, examples: [general, vip] }
        name: { type: string }
        benefits: { type: [string, 'null'] }
        is_default: { type: boolean, x-dart: MembershipLevel.isDefault }
    Notice:
      x-dart: Notice (NoticeDto.fromJson)
      type: object
      required: [id, title, body, status, published_at]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [published] }
        published_at: { type: [string, 'null'], format: date-time, x-dart: Notice.publishedAt }
        publish_ends_at: { type: [string, 'null'], format: date-time, x-dart: Notice.publishEndsAt }
        is_pinned: { type: boolean, x-dart: Notice.isPinned }
        audience: { type: string, enum: [public, members] }
        category:
          type: [object, 'null']
          properties:
            id: { type: string, x-dart: Notice.categoryId }
            name: { type: string, x-dart: Notice.categoryName }
        is_read: { type: boolean, description: Member endpoints only, x-dart: Notice.isRead }
    Booking:
      x-dart: Booking (BookingDto.fromJson)
      type: object
      required: [id, event_id, status, booked_at]
      properties:
        id: { type: string }
        event_id: { type: string }
        status: { type: string, enum: [confirmed, cancelled] }
        booked_at: { type: string, format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
    BookingInfo:
      x-dart: BookingInfo (BookingInfo.fromJson)
      type: object
      required: [event_id, enabled, booked_count, unavailable_reason, my_booking]
      properties:
        event_id: { type: string }
        enabled: { type: boolean }
        capacity: { type: [integer, 'null'] }
        booked_count: { type: integer }
        remaining: { type: [integer, 'null'] }
        opens_at: { type: [string, 'null'], format: date-time }
        closes_at: { type: [string, 'null'], format: date-time, description: Configured close time or the event start }
        unavailable_reason:
          type: [string, 'null']
          enum: [already_booked, event_not_published, event_cancelled, disabled, not_open, closed, full, null]
          description: Null when a new booking is possible now
          x-dart: BookingInfo.unavailableReason
        my_booking:
          oneOf:
            - { $ref: '#/components/schemas/Booking' }
            - { type: 'null' }
    CalendarEvent:
      x-dart: CalendarEvent (CalendarEventDto.fromJson)
      type: object
      required: [id, title, starts_at, ends_at, status, audience]
      properties:
        id: { type: string, description: Stable id (future bookings refer to it) }
        title: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time, description: UTC, x-dart: CalendarEvent.startsAt }
        ends_at: { type: string, format: date-time, description: UTC, x-dart: CalendarEvent.endsAt }
        status: { type: string, enum: [published, cancelled], x-dart: CalendarEvent.isCancelled }
        audience: { type: string, enum: [public, members] }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'], x-dart: CalendarEvent.cancelReason }
    MemberNotification:
      x-dart: MemberNotification (MemberNotificationDto.fromJson)
      type: object
      required: [id, type, title, body, action, is_read, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [system, account, membership, notice] }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 2000 }
        action:
          type: [object, 'null']
          description: Optional target; the App decides the screen (e.g. type notice + notice id)
          properties:
            type: { type: string, x-dart: MemberNotification.actionType }
            id: { type: [string, 'null'], x-dart: MemberNotification.actionId }
        is_read: { type: boolean, x-dart: MemberNotification.isRead }
        read_at: { type: [string, 'null'], format: date-time, x-dart: MemberNotification.readAt }
        created_at: { type: [string, 'null'], format: date-time, x-dart: MemberNotification.createdAt }
    Error:
      x-dart: App ApiException (code, message, fields, requestId, statusCode)
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            request_id: { type: string }
  headers:
    RequestId:
      schema: { type: string }
    RetryAfter:
      schema: { type: integer }
  responses:
    MemberResponse:
      description: Member profile
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Member' }
    EventRange:
      description: Events overlapping the range, ordered by start time
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
              meta:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  count: { type: integer }
                  truncated: { type: boolean, description: More than 200 events; narrow the range }
    EventResponse:
      description: One event (drafts are not found)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/CalendarEvent' }
    BookingInfoResponse:
      description: Booking information of the event for the current member
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/BookingInfo' }
    BookingConflict:
      description: '409 BOOKING_FULL / ALREADY_BOOKED / BOOKING_UNAVAILABLE (fields.reason) / BOOKING_NOT_ACTIVE (already cancelled)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoticeResponse:
      description: One notice
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Notice' }
    Message:
      description: Generic answer (does not reveal whether an account exists)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, properties: { message: { type: string } } }
    Reset:
      description: Password reset; every token of the account was revoked
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, properties: { reset: { type: boolean } } }
    Error:
      description: 'Error (e.g. 502 SMS_SEND_FAILED on /me/phone/send-otp, 503 DATABASE_UNAVAILABLE / AVATAR_UNAVAILABLE)'
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: '401 UNAUTHENTICATED (missing, revoked, idle-expired token or disabled account) / INVALID_CREDENTIALS (login)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '403 ACCOUNT_DISABLED / FORBIDDEN'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VerificationRequired:
      description: '403 VERIFICATION_REQUIRED — fields.verification = ["email"] or ["phone"]; the token stays valid'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '404 NOT_FOUND (also for drafts, withdrawn, scheduled and ended notices)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: '422 VALIDATION_FAILED (fields per input) / OTP_INVALID / RESET_TOKEN_INVALID / PHONE_MISSING; OTP_EXPIRED / OTP_LOCKED only from /me/phone/verify'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '429 RATE_LIMITED / SMS_COOLDOWN (Retry-After) / SMS_PHONE_LIMIT / SMS_GLOBAL_LIMIT'
      headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
