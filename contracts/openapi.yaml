              data: { $ref: '#/components/schemas/VerificationBadge' }
    VerificationRequestResponse:
      description: Application
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, properties: { id: { type: string }, status: { type: string } } }
    Binary:
      description: File content (private, no-store unless public campaign image)
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Conflict:
      description: '409 business conflict (e.g. BOOKING_FULL, IDEMPOTENCY_CONFLICT, CANCEL_DEADLINE_PASSED, CLAIM_CONFLICT, CHECKIN_CLOSED, WAITLISTED, NOT_CHECKED_IN, CHECKOUT_DISABLED, BOOKMARK_LIMIT_REACHED, REQUEST_PENDING, ALREADY_VERIFIED)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenOrVerification:
      description: '403 VERIFICATION_REQUIRED, or FORBIDDEN / VIP_REQUIRED / ELIGIBILITY_FAILED (missing staff permission, VIP or verification)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
