name: S1 Shared Core Checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'examples/poc_backend/**'
      - 'examples/poc_flutter/**'
      - '.github/workflows/s1-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/poc_backend/**'
      - 'examples/poc_flutter/**'
      - '.github/workflows/s1-core.yml'
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP lint and smoke tests
        run: |
          set -euo pipefail
          for f in packages/laravel/shared_core/src/*.php packages/laravel/shared_core/tests/*.php; do php -l "$f"; done
          php packages/laravel/shared_core/tests/smoke.php
          php packages/laravel/shared_core/tests/notice_read_smoke.php
          php packages/laravel/shared_core/tests/token_policy_smoke.php
          php packages/laravel/shared_core/tests/isolation_contract_smoke.php
          php packages/laravel/shared_core/tests/auth_settings_sms_smoke.php
      - name: Composer package validation
        working-directory: packages/laravel/shared_core
        run: composer validate --strict
  m08-backend-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install PoC backend dependencies
        working-directory: examples/poc_backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run M08 single-member feature contract (SQLite only)
        working-directory: examples/poc_backend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          php artisan test tests/Feature/S9/SingleMemberBookingContractTest.php tests/Feature/S6/BookingTest.php tests/Feature/S9/CourseEnrollmentServiceTest.php tests/Feature/S9/CourseGroupAdmissionTest.php

  flutter-poc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze changed Flutter PoC entry points
        working-directory: examples/poc_flutter
        run: |
          flutter pub get
          flutter analyze lib/features/s9/group_booking_screen.dart lib/features/calendar/event_detail_screen.dart lib/router.dart


  integration-premerge:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/m08-single-member-contract-20261029'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build complete Flutter Android debug APK
        working-directory: examples/poc_flutter
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Validate Laravel database migrations (SQLite)
        working-directory: examples/poc_backend
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          php artisan migrate:fresh --force

  dart:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Apply official Dart formatter on manual repair-branch run
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/m08-single-member-contract-20261029'
        working-directory: packages/flutter/shared_core
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- lib test
            git commit -m "style(dart): apply canonical SDK formatter to shared core"
            git push origin "HEAD:refs/heads/fix/m08-single-member-contract-20261029"
          fi
      - name: Verify canonical Dart formatting
        working-directory: packages/flutter/shared_core
        run: dart format --output none --set-exit-if-changed lib test
      - name: Dart analyze and smoke
        working-directory: packages/flutter/shared_core
        shell: bash
        run: |
          set -o pipefail
          dart pub get
          dart analyze
          dart run test/smoke.dart
          dart run test/contracts_smoke.dart
          dart run test/member_api_smoke.dart
          dart run test/session_api_smoke.dart
          dart run test/login_identifier_smoke.dart
          dart run test/registration_api_smoke.dart
          dart run test/password_reset_api_smoke.dart
          dart run test/profile_membership_smoke.dart
          dart run test/notice_api_smoke.dart
          dart run test/notification_api_smoke.dart
          dart run test/event_api_smoke.dart
          dart run test/booking_api_smoke.dart
          dart run test/booking_group_api_smoke.dart
          dart run test/article_api_smoke.dart
          dart run test/s9_api_smoke.dart
