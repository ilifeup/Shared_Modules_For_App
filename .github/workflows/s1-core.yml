name: S1 Shared Core Checks
on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/s1-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/s1-core.yml'
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP lint and smoke tests
        run: |
          set -euo pipefail
          for f in packages/laravel/shared_core/src/*.php packages/laravel/shared_core/tests/*.php; do php -l "$f"; done
          php packages/laravel/shared_core/tests/smoke.php
          php packages/laravel/shared_core/tests/notice_read_smoke.php
          php packages/laravel/shared_core/tests/token_policy_smoke.php
          php packages/laravel/shared_core/tests/isolation_contract_smoke.php
          php packages/laravel/shared_core/tests/auth_settings_sms_smoke.php
      - name: Composer package validation
        working-directory: packages/laravel/shared_core
        run: composer validate --strict
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dart format
        working-directory: packages/flutter/shared_core
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Dart analyze and smoke
        working-directory: packages/flutter/shared_core
        run: |
          dart pub get
          dart analyze
          dart run test/smoke.dart
          dart run test/contracts_smoke.dart
          dart run test/member_api_smoke.dart
          dart run test/session_api_smoke.dart
          dart run test/login_identifier_smoke.dart
