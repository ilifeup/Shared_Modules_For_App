name: Validate S0 Documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify required files and module IDs
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md AGENTS.md CLAUDE.md docs/shared_modules_list.md docs/module_matrix.md docs/architecture.md docs/project_plan.md docs/decisions/ADR-001.md docs/specs/three_apps_shared_modules_spec_v1.md docs/specs/three_apps_poc_acceptance_plan_v1.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          for n in $(seq -w 1 20); do
            grep -q "M$n" docs/shared_modules_list.md || { echo "Missing module M$n"; exit 1; }
          done
          grep -q 'AGENTS.md' CLAUDE.md
          echo "S0 documentation structure: PASS"
      - name: Actions pinned to commit SHAs
        shell: bash
        run: bash .github/scripts/check_action_pins.sh
      - name: OpenAPI document is valid
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet openapi-spec-validator==0.7.1
          "$RUNNER_TEMP/venv/bin/openapi-spec-validator" contracts/openapi.yaml
