name: s1_poc_app
description: Disposable S1 PoC client (shared modules; not a production App)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  app_links: ^6.4.0
  dio: ^5.11.1
  eachcore_shared_core:
    path: ../../packages/flutter/shared_core
  eachcore_shared_ui:
    path: ../../packages/flutter/shared_ui
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.0
  go_router: ^18.1.1
  image_picker: ^1.1.2
  # S9 M11 QR check-in, M14 share / App Links, M09 Google consent.
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
