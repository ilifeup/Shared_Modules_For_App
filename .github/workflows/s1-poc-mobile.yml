name: S1 PoC Mobile

# Flutter 3.47 client: format, analyze, widget tests, Android debug APK, and a
# real Flutter -> Laravel API -> MySQL end-to-end test (synthetic data only).
on:
  pull_request:
    paths:
      - 'examples/poc_flutter/**'
      - 'examples/poc_backend/**'
      - 'packages/**'
      - '.github/workflows/s1-poc-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'examples/poc_flutter/**'
      - 'examples/poc_backend/**'
      - 'packages/**'
      - '.github/workflows/s1-poc-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-poc-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: examples/poc_flutter
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Flutter version
        run: flutter --version | sed -n 1p | grep -E '^Flutter 3\.47\.'

      - name: Pub get (lockfile enforced)
        run: |
          if ! flutter pub get --enforce-lockfile; then
            # Still a failure: publish what the resolved lock would be, for review and commit.
            flutter pub get > "$RUNNER_TEMP/pubget.log" 2>&1 || bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/pubget.log" "pub get" 120 3 tail
            git diff -- pubspec.lock > "$RUNNER_TEMP/lock.diff"
            bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/lock.diff" "pubspec.lock out of date" 8000 30 tail
            exit 1
          fi

      - name: Format check (prints the diff on failure)
        run: |
          dart format lib test
          git diff -- . > "$RUNNER_TEMP/format.diff"
          if [ -s "$RUNNER_TEMP/format.diff" ]; then
            bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/format.diff" "dart format diff" 4000 30 tail
            exit 1
          fi

      - name: Analyze
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Widget and unit tests
        run: flutter test --exclude-tags e2e 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Shared UI package (format, analyze, widget tests)
        working-directory: packages/flutter/shared_ui
        run: |
          flutter pub get
          dart format lib test
          git diff -- . > "$RUNNER_TEMP/shared_ui_format.diff"
          if [ -s "$RUNNER_TEMP/shared_ui_format.diff" ]; then
            bash ../../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/shared_ui_format.diff" "dart format diff (shared_ui)" 400
            exit 1
          fi
          flutter analyze
          flutter test 2>&1 | tee "$RUNNER_TEMP/shared_ui.log"

      - name: Publish failure details as annotations
        if: failure()
        run: |
          for f in analyze test shared_ui; do
            [ -s "$RUNNER_TEMP/$f.log" ] && bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/$f.log" "$f" 150
          done
          true

      - name: Free runner disk space for the Android build (NDK, Gradle)
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=env/dev.json 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish build failure details as annotations
        if: failure()
        run: |
          [ -s "$RUNNER_TEMP/build.log" ] && bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/build.log" "build" 300 8 tail
          true

      - name: Verify application ID and targetSdk 36
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          BADGING="$("$BT"aapt2 dump badging build/app/outputs/flutter-apk/app-debug.apk)"
          echo "$BADGING" | grep -E "^package:|targetSdkVersion"
          grep -q "package: name='com.eachcore.s1poc.dev'" <<< "$BADGING"
          grep -q "targetSdkVersion:'36'" <<< "$BADGING"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: s1-poc-debug-apk
          path: examples/poc_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: s1_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: s1_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Start Laravel API (disposable MySQL)
        working-directory: examples/poc_backend
        env:
          E2E_MEMBER_PASSWORD: e2e-synthetic-password
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          bash scripts/ci_env.sh
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=E2eSeeder --force --no-interaction
          nohup php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 1; done

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Flutter -> Laravel API -> MySQL
        working-directory: examples/poc_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter test --tags e2e --reporter expanded --dart-define=E2E_API_BASE_URL=http://127.0.0.1:8000 --dart-define=E2E_MEMBER_PASSWORD=e2e-synthetic-password 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          # The test must have actually run (not skipped).
          grep -qE '\+1: All tests passed' "$RUNNER_TEMP/e2e.log"
          if grep -qE '~[1-9]' "$RUNNER_TEMP/e2e.log"; then echo "::error::E2E test was skipped"; exit 1; fi

      - name: Server log on failure
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/serve.log" || true
          [ -s "$RUNNER_TEMP/e2e.log" ] && bash ../../.github/scripts/annotate_failure.sh "$RUNNER_TEMP/e2e.log" "e2e" 200 4 || true
