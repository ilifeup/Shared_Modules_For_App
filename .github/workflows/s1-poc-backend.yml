name: S1 PoC Backend

# Laravel 13 + Sanctum + Filament 5 + Spatie on PHP 8.4 / MySQL 8.4.
# Test only: no deployment, no secrets, synthetic data, disposable database.
on:
  pull_request:
    paths:
      - 'examples/poc_backend/**'
      - 'packages/laravel/**'
      - 'contracts/**'
      - '.github/scripts/**'
      - '.github/workflows/s1-poc-backend.yml'
  push:
    branches: [main]
    paths:
      - 'examples/poc_backend/**'
      - 'packages/laravel/**'
      - 'contracts/**'
      - '.github/scripts/**'
      - '.github/workflows/s1-poc-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-poc-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: examples/poc_backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: s1_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: s1_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Verify PHP 8.4
        id: php
        run: |
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 ? 0 : 1);'

      - name: Composer validate
        id: validate
        run: composer validate --strict --no-check-publish

      - name: Composer install
        id: install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit (diagnostic, checked by Gate)
        id: audit
        continue-on-error: true
        run: composer audit

      - name: Prepare environment
        run: bash scripts/ci_env.sh

      - name: Verify MySQL 8.4
        id: mysql
        run: |
          php -r '$v = (new PDO("mysql:host=127.0.0.1;port=3306", "root", "root"))->query("select version()")->fetchColumn(); echo "MySQL $v\n"; exit(str_starts_with($v, "8.4.") ? 0 : 1);'

      - name: Migrate (MySQL)
        id: migrate
        run: php artisan migrate --force --no-interaction

      - name: OpenAPI contract matches the real routes
        id: openapi
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2
          php artisan route:list --path=api --json > "$RUNNER_TEMP/routes.json"
          "$RUNNER_TEMP/venv/bin/python" ../../.github/scripts/check_openapi_routes.py ../../contracts/openapi.yaml "$RUNNER_TEMP/routes.json"

      - name: Pint (diagnostic, checked by Gate)
        id: pint
        continue-on-error: true
        run: |
          if ! vendor/bin/pint --test -v; then
            # Print the formatter's exact proposed patch for reproducible CI
            # diagnostics. Do not alter the checked-out source or weaken Gate.
            vendor/bin/pint --quiet
            echo 'PINT_PATCH_BEGIN'
            git diff --no-ext-diff --unified=3 -- examples/poc_backend
            echo 'PINT_PATCH_END'
            exit 1
          fi

      - name: Pest (MySQL)
        id: pest
        run: php artisan test 2>&1 | tee "$RUNNER_TEMP/pest.log"

      - name: HTTP end-to-end smoke (php artisan serve + curl)
        id: e2e
        run: bash scripts/e2e_api_smoke.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: OTP concurrency (parallel HTTP, multi-worker server, MySQL lock)
        id: concurrency
        timeout-minutes: 5
        run: bash scripts/otp_concurrency_check.sh 2>&1 | tee "$RUNNER_TEMP/concurrency.log"

      - name: Booking concurrency (parallel HTTP, last seat, MySQL row lock)
        id: booking_concurrency
        timeout-minutes: 5
        run: bash scripts/booking_concurrency_check.sh 2>&1 | tee "$RUNNER_TEMP/booking_concurrency.log"

      - name: S9 booking concurrency (100 parallel S6 + S9 requests, FIFO, idempotency)
        id: s9_concurrency
        timeout-minutes: 8
        run: bash scripts/s9_booking_concurrency_check.sh 2>&1 | tee "$RUNNER_TEMP/s9_concurrency.log"

      - name: M11 check-in concurrency (overlapping member-only QR batches)
        id: m11_concurrency
        timeout-minutes: 8
        run: bash scripts/m11_checkin_concurrency_check.sh 2>&1 | tee "$RUNNER_TEMP/m11_concurrency.log"

      - name: Verify irreversible guest-purge migration and member-only schema
        id: rollback
        run: |
          set -o pipefail
          {
            # Invoke this exact migration's down() directly, not migrate:rollback
            # (which may select a different migration in the current batch).
            php artisan tinker --execute='$migration = require base_path("database/migrations/2026_11_02_000100_remove_guest_bookings.php"); try { $migration->down(); echo "GUARD_BYPASSED", PHP_EOL; exit(1); } catch (RuntimeException $e) { if ($e->getMessage() !== "Guest booking purge is irreversible; restore the verified database backup instead.") { throw $e; } echo "IRREVERSIBLE_GUARD_OK", PHP_EOL; }' | tee /dev/stderr | grep -q IRREVERSIBLE_GUARD_OK
            php artisan tinker --execute='$s = Illuminate\Support\Facades\Schema::class; $ok = $s::hasTable("event_booking_groups") && ! $s::hasColumn("event_booking_groups", "is_guest") && ! $s::hasColumn("event_categories", "allow_guest_booking") && ! $s::hasColumn("event_booking_groups", "claimed_at"); echo $ok ? "MEMBER_ONLY_SCHEMA_OK" : "MEMBER_ONLY_SCHEMA_FAILED", PHP_EOL;' | tee /dev/stderr | grep -q MEMBER_ONLY_SCHEMA_OK
            echo "PASS: irreversible migration guard and member-only schema"
          } 2>&1 | tee "$RUNNER_TEMP/rollback.log"

      - name: Publish failure details as annotations
        if: failure() || steps.pint.outcome == 'failure'
        working-directory: .
        run: |
          set +e
          [ "${{ steps.pint.outcome }}" = failure ] && (cd examples/poc_backend && vendor/bin/pint --test -v > "$RUNNER_TEMP/pint.log" 2>&1; true)
          for f in pint pest e2e concurrency booking_concurrency s9_concurrency m11_concurrency rollback; do
            [ -s "$RUNNER_TEMP/$f.log" ] && bash .github/scripts/annotate_failure.sh "$RUNNER_TEMP/$f.log" "$f" 400
          done
          if [ -f examples/poc_backend/storage/logs/laravel.log ]; then
            grep -E '^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|CRITICAL)' examples/poc_backend/storage/logs/laravel.log | cut -c1-1200 | head -n 8 > "$RUNNER_TEMP/errors.log"
            [ -s "$RUNNER_TEMP/errors.log" ] && bash .github/scripts/annotate_failure.sh "$RUNNER_TEMP/errors.log" laravel-errors 8 3 tail
            bash .github/scripts/annotate_failure.sh examples/poc_backend/storage/logs/laravel.log laravel.log 60 1
          fi
          true

      - name: Summary
        if: always()
        run: |
          {
            echo "## S1 PoC backend"
            echo "- commit: \`$GITHUB_SHA\`（ref: $GITHUB_REF_NAME）, run $GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| PHP 8.4 | ${{ steps.php.outcome }} |"
            echo "| composer validate | ${{ steps.validate.outcome }} |"
            echo "| composer install | ${{ steps.install.outcome }} |"
            echo "| composer audit | ${{ steps.audit.outcome }} |"
            echo "| MySQL 8.4 | ${{ steps.mysql.outcome }} |"
            echo "| migrate | ${{ steps.migrate.outcome }} |"
            echo "| OpenAPI = routes | ${{ steps.openapi.outcome }} |"
            echo "| Pint | ${{ steps.pint.outcome }} |"
            echo "| Pest | ${{ steps.pest.outcome }} |"
            echo "| HTTP E2E | ${{ steps.e2e.outcome }} |"
            echo "| OTP concurrency | ${{ steps.concurrency.outcome }} |"
            echo "| Booking concurrency | ${{ steps.booking_concurrency.outcome }} |"
            echo "| S9 booking concurrency | ${{ steps.s9_concurrency.outcome }} |"
            echo "| M11 check-in concurrency | ${{ steps.m11_concurrency.outcome }} |"
            echo "| S9 rollback drill | ${{ steps.rollback.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate (fail unless every check succeeded)
        if: always()
        env:
          OUTCOMES: >-
            php=${{ steps.php.outcome }}
            validate=${{ steps.validate.outcome }}
            install=${{ steps.install.outcome }}
            audit=${{ steps.audit.outcome }}
            mysql=${{ steps.mysql.outcome }}
            migrate=${{ steps.migrate.outcome }}
            openapi=${{ steps.openapi.outcome }}
            pint=${{ steps.pint.outcome }}
            pest=${{ steps.pest.outcome }}
            e2e=${{ steps.e2e.outcome }}
            concurrency=${{ steps.concurrency.outcome }}
            booking_concurrency=${{ steps.booking_concurrency.outcome }}
            s9_concurrency=${{ steps.s9_concurrency.outcome }}
            m11_concurrency=${{ steps.m11_concurrency.outcome }}
            rollback=${{ steps.rollback.outcome }}
        run: |
          failed=0
          for item in $OUTCOMES; do
            echo "$item"
            [ "${item#*=}" = "success" ] || failed=1
          done
          exit "$failed"
